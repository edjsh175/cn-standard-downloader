name: std-worker

services:
  std-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: std-worker
    restart: unless-stopped
    ports:
      - "${STD_WORKER_PORT:-8765}:8765"
    environment:
      STD_DB_HOST: ${STD_DB_HOST}
      STD_DB_PORT: ${STD_DB_PORT:-3306}
      STD_DB_USER: ${STD_DB_USER}
      STD_DB_PASSWORD: ${STD_DB_PASSWORD}
      STD_DB_DATABASE: ${STD_DB_DATABASE}
      STD_CHAOJIYING_USER: ${STD_CHAOJIYING_USER}
      STD_CHAOJIYING_PASS: ${STD_CHAOJIYING_PASS}
      STD_CHAOJIYING_SOFTID: ${STD_CHAOJIYING_SOFTID}
      STD_PDF_DIR: /app/artifacts/pdf
      STD_TEMP_DIR: /app/.tmp/runtime
      STD_DEBUG_DIR: /app/artifacts/debug
      STD_HEADLESS_BROWSER: ${STD_HEADLESS_BROWSER:-true}
      STD_WORKER_HOST: 0.0.0.0
      STD_WORKER_PORT: 8765
      STD_CHROMEDRIVER_PATH: /usr/bin/chromedriver
      STD_CHROME_BINARY: /usr/bin/chromium
    volumes:
      - ./artifacts:/app/artifacts
      - ./.tmp:/app/.tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    mem_limit: "2g"
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
