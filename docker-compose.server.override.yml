services:
  std-worker:
    build:
      dockerfile: Dockerfile.server
    environment:
      STD_WORKER_HOST: 127.0.0.1
      STD_WORKER_PORT: ${STD_WORKER_PORT:-8765}
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:$${STD_WORKER_PORT:-8765}/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
